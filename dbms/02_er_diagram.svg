<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="100%" height="100%" style="background-color: #0b0f14; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients & Filters -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#73daca" />
    </marker>
    <marker id="circle" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="3" fill="#0b0f14" stroke="#73daca" stroke-width="2"/>
    </marker>
  </defs>

  <!-- Canvas Background & Title -->
  <rect x="0" y="0" width="1100" height="800" fill="#0b0f14"/>
  <text x="550" y="45" text-anchor="middle" fill="#e7edf5" font-size="22" font-weight="bold" letter-spacing="2">TRIPCRAFT — ENTITY RELATIONSHIP DIAGRAM (ERD)</text>
  <text x="550" y="70" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="monospace">Advanced Programming &amp; Data Engineering 2026 • Team T0063 • PostgreSQL 16</text>

  <!-- ============================================================== -->
  <!-- ENTITY 1: DESTINATIONS (Top Left) -->
  <!-- ============================================================== -->
  <g transform="translate(60, 110)" filter="url(#shadow)">
    <!-- Box -->
    <rect width="280" height="260" rx="8" fill="#131b24" stroke="#2a3644" stroke-width="1.5"/>
    <rect width="280" height="40" rx="8" fill="url(#headerGrad)"/>
    <rect y="32" width="280" height="8" fill="#1e293b"/>
    <!-- Header -->
    <text x="14" y="25" fill="#73daca" font-size="13" font-weight="bold" font-family="monospace">TABLE: destinations</text>
    <!-- Attributes -->
    <text x="16" y="65" fill="#38bdf8" font-size="12" font-weight="bold">PK  id</text>
    <text x="130" y="65" fill="#94a3b8" font-size="12" font-family="monospace">SERIAL</text>
    <text x="16" y="90" fill="#f472b6" font-size="12" font-weight="bold">UK  slug</text>
    <text x="130" y="90" fill="#94a3b8" font-size="12" font-family="monospace">VARCHAR(100)</text>
    <text x="16" y="115" fill="#e7edf5" font-size="12">    name</text>
    <text x="130" y="115" fill="#94a3b8" font-size="12" font-family="monospace">VARCHAR(150)</text>
    <text x="16" y="140" fill="#e7edf5" font-size="12">    state</text>
    <text x="130" y="140" fill="#94a3b8" font-size="12" font-family="monospace">VARCHAR(100)</text>
    <text x="16" y="165" fill="#e7edf5" font-size="12">    category</text>
    <text x="130" y="165" fill="#94a3b8" font-size="12" font-family="monospace">VARCHAR(50)</text>
    <text x="16" y="190" fill="#e7edf5" font-size="12">    budget_inr</text>
    <text x="130" y="190" fill="#94a3b8" font-size="12" font-family="monospace">INTEGER</text>
    <text x="16" y="215" fill="#e7edf5" font-size="12">    highlights</text>
    <text x="130" y="215" fill="#94a3b8" font-size="12" font-family="monospace">JSONB</text>
    <text x="16" y="240" fill="#e7edf5" font-size="12">    best_season</text>
    <text x="130" y="240" fill="#94a3b8" font-size="12" font-family="monospace">VARCHAR(100)</text>
  </g>

  <!-- ============================================================== -->
  <!-- ENTITY 2: TRIPS (Center Main) -->
  <!-- ============================================================== -->
  <g transform="translate(420, 110)" filter="url(#shadow)">
    <!-- Box -->
    <rect width="290" height="310" rx="8" fill="#131b24" stroke="#73daca" stroke-width="1.5"/>
    <rect width="290" height="40" rx="8" fill="#164e63"/>
    <rect y="32" width="290" height="8" fill="#164e63"/>
    <!-- Header -->
    <text x="14" y="25" fill="#e7edf5" font-size="14" font-weight="bold" font-family="monospace">TABLE: trips [MASTER]</text>
    <!-- Attributes -->
    <text x="16" y="65" fill="#38bdf8" font-size="12" font-weight="bold">PK  id</text>
    <text x="140" y="65" fill="#94a3b8" font-size="12" font-family="monospace">SERIAL</text>
    <text x="16" y="90" fill="#fbbf24" font-size="12" font-weight="bold">FK  destination_id</text>
    <text x="140" y="90" fill="#94a3b8" font-size="12" font-family="monospace">INTEGER (NULL)</text>
    <text x="16" y="115" fill="#e7edf5" font-size="12">    title</text>
    <text x="140" y="115" fill="#94a3b8" font-size="12" font-family="monospace">VARCHAR(200)</text>
    <text x="16" y="140" fill="#e7edf5" font-size="12">    destination</text>
    <text x="140" y="140" fill="#94a3b8" font-size="12" font-family="monospace">VARCHAR(150)</text>
    <text x="16" y="165" fill="#e7edf5" font-size="12">    start_date</text>
    <text x="140" y="165" fill="#94a3b8" font-size="12" font-family="monospace">DATE</text>
    <text x="16" y="190" fill="#e7edf5" font-size="12">    end_date</text>
    <text x="140" y="190" fill="#94a3b8" font-size="12" font-family="monospace">DATE</text>
    <text x="16" y="215" fill="#e7edf5" font-size="12">    budget</text>
    <text x="140" y="215" fill="#94a3b8" font-size="12" font-family="monospace">NUMERIC(12,2)</text>
    <text x="16" y="240" fill="#e7edf5" font-size="12">    status</text>
    <text x="140" y="240" fill="#94a3b8" font-size="12" font-family="monospace">VARCHAR(50)</text>
    <text x="16" y="265" fill="#e7edf5" font-size="12">    travelers</text>
    <text x="140" y="265" fill="#94a3b8" font-size="12" font-family="monospace">VARCHAR(100)</text>
    <text x="16" y="290" fill="#e7edf5" font-size="12">    created_at</text>
    <text x="140" y="290" fill="#94a3b8" font-size="12" font-family="monospace">TIMESTAMPTZ</text>
  </g>

  <!-- ============================================================== -->
  <!-- ENTITY 3: ITINERARY_ITEMS (Bottom Left) -->
  <!-- ============================================================== -->
  <g transform="translate(180, 500)" filter="url(#shadow)">
    <!-- Box -->
    <rect width="280" height="260" rx="8" fill="#131b24" stroke="#2a3644" stroke-width="1.5"/>
    <rect width="280" height="40" rx="8" fill="url(#headerGrad)"/>
    <rect y="32" width="280" height="8" fill="#1e293b"/>
    <!-- Header -->
    <text x="14" y="25" fill="#73daca" font-size="13" font-weight="bold" font-family="monospace">TABLE: itinerary_items</text>
    <!-- Attributes -->
    <text x="16" y="65" fill="#38bdf8" font-size="12" font-weight="bold">PK  id</text>
    <text x="130" y="65" fill="#94a3b8" font-size="12" font-family="monospace">SERIAL</text>
    <text x="16" y="90" fill="#fbbf24" font-size="12" font-weight="bold">FK  trip_id</text>
    <text x="130" y="90" fill="#94a3b8" font-size="12" font-family="monospace">INTEGER [CASCADE]</text>
    <text x="16" y="115" fill="#e7edf5" font-size="12">    day_number</text>
    <text x="130" y="115" fill="#94a3b8" font-size="12" font-family="monospace">INTEGER (>=1)</text>
    <text x="16" y="140" fill="#e7edf5" font-size="12">    time_slot</text>
    <text x="130" y="140" fill="#94a3b8" font-size="12" font-family="monospace">VARCHAR(50)</text>
    <text x="16" y="165" fill="#e7edf5" font-size="12">    title</text>
    <text x="130" y="165" fill="#94a3b8" font-size="12" font-family="monospace">VARCHAR(250)</text>
    <text x="16" y="190" fill="#e7edf5" font-size="12">    location</text>
    <text x="130" y="190" fill="#94a3b8" font-size="12" font-family="monospace">VARCHAR(200)</text>
    <text x="16" y="215" fill="#e7edf5" font-size="12">    cost</text>
    <text x="130" y="215" fill="#94a3b8" font-size="12" font-family="monospace">NUMERIC(10,2)</text>
    <text x="16" y="240" fill="#e7edf5" font-size="12">    completed</text>
    <text x="130" y="240" fill="#94a3b8" font-size="12" font-family="monospace">BOOLEAN</text>
  </g>

  <!-- ============================================================== -->
  <!-- ENTITY 4: EXPENSES (Bottom Right) -->
  <!-- ============================================================== -->
  <g transform="translate(640, 500)" filter="url(#shadow)">
    <!-- Box -->
    <rect width="280" height="260" rx="8" fill="#131b24" stroke="#2a3644" stroke-width="1.5"/>
    <rect width="280" height="40" rx="8" fill="url(#headerGrad)"/>
    <rect y="32" width="280" height="8" fill="#1e293b"/>
    <!-- Header -->
    <text x="14" y="25" fill="#73daca" font-size="13" font-weight="bold" font-family="monospace">TABLE: expenses</text>
    <!-- Attributes -->
    <text x="16" y="65" fill="#38bdf8" font-size="12" font-weight="bold">PK  id</text>
    <text x="130" y="65" fill="#94a3b8" font-size="12" font-family="monospace">SERIAL</text>
    <text x="16" y="90" fill="#fbbf24" font-size="12" font-weight="bold">FK  trip_id</text>
    <text x="130" y="90" fill="#94a3b8" font-size="12" font-family="monospace">INTEGER [CASCADE]</text>
    <text x="16" y="115" fill="#e7edf5" font-size="12">    title</text>
    <text x="130" y="115" fill="#94a3b8" font-size="12" font-family="monospace">VARCHAR(200)</text>
    <text x="16" y="140" fill="#e7edf5" font-size="12">    category</text>
    <text x="130" y="140" fill="#94a3b8" font-size="12" font-family="monospace">VARCHAR(50)</text>
    <text x="16" y="165" fill="#e7edf5" font-size="12">    amount</text>
    <text x="130" y="165" fill="#94a3b8" font-size="12" font-family="monospace">NUMERIC(10,2)</text>
    <text x="16" y="190" fill="#e7edf5" font-size="12">    date</text>
    <text x="130" y="190" fill="#94a3b8" font-size="12" font-family="monospace">DATE</text>
    <text x="16" y="215" fill="#e7edf5" font-size="12">    payment_method</text>
    <text x="130" y="215" fill="#94a3b8" font-size="12" font-family="monospace">VARCHAR(50)</text>
    <text x="16" y="240" fill="#e7edf5" font-size="12">    created_at</text>
    <text x="130" y="240" fill="#94a3b8" font-size="12" font-family="monospace">TIMESTAMPTZ</text>
  </g>

  <!-- ============================================================== -->
  <!-- ENTITY 5: IMPORTED_DATASETS (Top Right - ETL) -->
  <!-- ============================================================== -->
  <g transform="translate(780, 110)" filter="url(#shadow)">
    <!-- Box -->
    <rect width="260" height="200" rx="8" fill="#131b24" stroke="#2a3644" stroke-width="1.5"/>
    <rect width="260" height="40" rx="8" fill="url(#headerGrad)"/>
    <rect y="32" width="260" height="8" fill="#1e293b"/>
    <!-- Header -->
    <text x="14" y="25" fill="#818cf8" font-size="13" font-weight="bold" font-family="monospace">TABLE: imported_datasets</text>
    <!-- Attributes -->
    <text x="16" y="65" fill="#38bdf8" font-size="12" font-weight="bold">PK  id</text>
    <text x="120" y="65" fill="#94a3b8" font-size="12" font-family="monospace">SERIAL</text>
    <text x="16" y="90" fill="#e7edf5" font-size="12">    filename</text>
    <text x="120" y="90" fill="#94a3b8" font-size="12" font-family="monospace">VARCHAR(255)</text>
    <text x="16" y="115" fill="#e7edf5" font-size="12">    dataset_type</text>
    <text x="120" y="115" fill="#94a3b8" font-size="12" font-family="monospace">VARCHAR(50)</text>
    <text x="16" y="140" fill="#e7edf5" font-size="12">    total_rows</text>
    <text x="120" y="140" fill="#94a3b8" font-size="12" font-family="monospace">INTEGER</text>
    <text x="16" y="165" fill="#e7edf5" font-size="12">    cleaning_summary</text>
    <text x="120" y="165" fill="#94a3b8" font-size="12" font-family="monospace">JSONB</text>
    <text x="16" y="190" fill="#e7edf5" font-size="12">    uploaded_at</text>
    <text x="120" y="190" fill="#94a3b8" font-size="12" font-family="monospace">TIMESTAMPTZ</text>
  </g>

  <!-- ============================================================== -->
  <!-- RELATIONSHIP CONNECTORS & CARDINALITIES -->
  <!-- ============================================================== -->

  <!-- Relationship 1: destinations (1) -> trips (N) -->
  <path d="M 340 200 L 420 200" fill="none" stroke="#73daca" stroke-width="2" marker-start="url(#circle)" marker-end="url(#arrow)"/>
  <rect x="360" y="180" width="40" height="18" rx="3" fill="#0b0f14" stroke="#2a3644"/>
  <text x="380" y="193" fill="#73daca" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">1 : N</text>

  <!-- Relationship 2: trips (1) -> itinerary_items (N) [CASCADE] -->
  <path d="M 500 420 L 500 460 L 320 460 L 320 500" fill="none" stroke="#73daca" stroke-width="2" marker-start="url(#circle)" marker-end="url(#arrow)"/>
  <rect x="370" y="450" width="75" height="20" rx="3" fill="#0b0f14" stroke="#2a3644"/>
  <text x="407" y="464" fill="#73daca" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">1:N (CASCADE)</text>

  <!-- Relationship 3: trips (1) -> expenses (N) [CASCADE] -->
  <path d="M 630 420 L 630 460 L 780 460 L 780 500" fill="none" stroke="#73daca" stroke-width="2" marker-start="url(#circle)" marker-end="url(#arrow)"/>
  <rect x="670" y="450" width="75" height="20" rx="3" fill="#0b0f14" stroke="#2a3644"/>
  <text x="707" y="464" fill="#73daca" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">1:N (CASCADE)</text>

  <!-- Legend -->
  <g transform="translate(60, 420)">
    <rect width="250" height="60" rx="4" fill="#131b24" stroke="#2a3644"/>
    <text x="12" y="20" fill="#94a3b8" font-size="11" font-weight="bold">LEGEND &amp; INTEGRITY RULES:</text>
    <circle cx="20" cy="38" r="4" fill="#38bdf8"/>
    <text x="32" y="42" fill="#e7edf5" font-size="11">PK: Primary Key</text>
    <circle cx="120" cy="38" r="4" fill="#fbbf24"/>
    <text x="132" y="42" fill="#e7edf5" font-size="11">FK: Foreign Key</text>
    <circle cx="200" cy="38" r="4" fill="#f472b6"/>
    <text x="212" y="42" fill="#e7edf5" font-size="11">UK: Unique</text>
  </g>
</svg>
